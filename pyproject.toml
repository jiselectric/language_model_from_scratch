[project]
name = "language-model-from-scratch"
version = "0.1.0"
description = "Language model components developed while studying Stanford CS336"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
dependencies = [
    "torch~=2.11.0",
    "regex>=2026.3.32",
    "psutil>=7",
    "tqdm>=4.67",
]

[dependency-groups]
dev = [
    "numpy>=2.4",
    "pytest>=9.0",
    "pytest-timeout",
    "jaxtyping>=0.3",
    "einops>=0.8",
    "tiktoken>=0.12.0",
    "ruff>=0.15.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lm_from_scratch"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
ignore = ["F722"]
